[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wimp-legend"
version = "0.1.0"
description = "Modular WIMP and dark-matter sensitivity calculations for germanium detectors"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
